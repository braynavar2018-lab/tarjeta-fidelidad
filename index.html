<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Fidelidad</title>
    <!-- Usamos Tailwind CSS para que se vea como app profesional sin escribir diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-900 text-white flex flex-col items-center justify-center min-h-screen p-4 font-sans">

    <div id="login-screen" class="w-full max-w-sm text-center">
        <h1 class="text-3xl font-bold mb-6">Puntos Caffeto</h1>
        <p class="mb-4 text-zinc-400">Ingresa tu número de celular para ver tu tarjeta</p>
        <input type="number" id="telefono" class="w-full p-3 rounded-lg text-black mb-4 text-center text-xl" placeholder="Ej: 9711234567">
        <button onclick="iniciarSesion()" class="w-full bg-amber-500 hover:bg-amber-600 text-black font-bold py-3 rounded-lg transition">Ver mis puntos</button>
        <p id="msg-login" class="text-red-400 mt-4 hidden"></p>
    </div>

    <div id="dashboard-screen" class="w-full max-w-sm text-center hidden">
        <h2 class="text-2xl font-bold mb-2">¡Hola, <span id="lbl-nombre"></span>!</h2>
        <div class="bg-zinc-800 p-6 rounded-2xl mb-6 shadow-xl border border-zinc-700">
            <p class="text-zinc-400 mb-2">Tienes acumulados:</p>
            <p class="text-6xl font-black text-amber-500 mb-2" id="lbl-puntos">0</p>
            <p class="text-sm text-zinc-400">puntos</p>
        </div>
        
        <!-- Esta sección solo se mostrará si quien entra es Admin -->
        <div id="admin-panel" class="hidden bg-zinc-800 p-4 rounded-xl border border-blue-500/50">
            <h3 class="font-bold text-blue-400 mb-3">Panel de Empleado</h3>
            <input type="number" id="telefono-cliente" class="w-full p-2 rounded text-black mb-3" placeholder="Celular del cliente a sellar">
            <button onclick="sumarPunto()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded">Sumar 1 Punto</button>
            <p id="msg-admin" class="mt-2 text-sm"></p>
        </div>
    </div>

    <script>
        // PEGA TU LINK DE APPS SCRIPT AQUÍ ABAJO
        const API_URL = "https://script.google.com/macros/s/AKfycbwFQTvj3VABOk-K1pW0hwpRXaM3qDaoM9sRbgHk0zAto5ksk8MwOJOEGklklONmLBBA8Q/exec";
        let miTelefono = "";

        async function iniciarSesion() {
            miTelefono = document.getElementById("telefono").value;
            if(!miTelefono) return;
            
            const btn = event.target;
            btn.innerText = "Cargando...";
            
            try {
                const res = await fetch(`${API_URL}?action=login&telefono=${miTelefono}`);
                const data = await res.json();
                
                if(data.success) {
                    document.getElementById("login-screen").classList.add("hidden");
                    document.getElementById("dashboard-screen").classList.remove("hidden");
                    document.getElementById("lbl-nombre").innerText = data.nombre;
                    document.getElementById("lbl-puntos").innerText = data.puntos;
                    
                    if(data.rol === "Admin") {
                        document.getElementById("admin-panel").classList.remove("hidden");
                    }
                } else {
                    document.getElementById("msg-login").innerText = "Número no registrado.";
                    document.getElementById("msg-login").classList.remove("hidden");
                    btn.innerText = "Ver mis puntos";
                }
            } catch(e) {
                btn.innerText = "Ver mis puntos";
            }
        }

        async function sumarPunto() {
            const telCliente = document.getElementById("telefono-cliente").value;
            const msg = document.getElementById("msg-admin");
            if(!telCliente) return;

            msg.innerText = "Guardando...";
            msg.className = "mt-2 text-sm text-zinc-400";

            try {
                const res = await fetch(`${API_URL}?action=sumar&admin=${miTelefono}&cliente=${telCliente}`);
                const data = await res.json();

                if(data.success) {
                    msg.innerText = "¡Punto sumado con éxito!";
                    msg.className = "mt-2 text-sm text-green-400";
                    document.getElementById("telefono-cliente").value = "";
                } else {
                    msg.innerText = "Error: " + data.error;
                    msg.className = "mt-2 text-sm text-red-400";
                }
            } catch(e) {
                msg.innerText = "Error de conexión.";
            }
        }
    </script>
</body>
</html>
